version: 1

frontend:
  phases:
    preBuild:
      commands:
        - cd src/react-frontend
        - npm install
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: src/react-frontend/build
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - src/react-frontend/node_modules/**/*
